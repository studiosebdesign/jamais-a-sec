<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FFCC00">
<meta name="description" content="Jamais à sec : la station qui vaut vraiment le détour, gain net calculé pour votre voiture, et les pénuries de carburant autour de vous.">
<title>Jamais à sec</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ===== VERDICT ===== -->
  <section class="ecran" id="ecran-verdict" aria-label="Verdict"></section>

  <!-- ===== RADAR ===== -->
  <section class="ecran" id="ecran-radar" aria-label="Radar">
    <div id="map" role="region" aria-label="Carte des stations et des zones en rupture">
      <div id="carte"></div>
      <canvas id="contamination" aria-hidden="true"></canvas>
      <div class="radar-tete" style="z-index:3"><h1>Radar</h1><button class="puce" style="background:var(--j);color:var(--n)" data-carbu>Gazole</button></div>
      <div class="legende" style="z-index:3;bottom:28px">
        <span><em style="background:#FFCC00"></em>Approvisionnée</span>
        <span><em style="background:#FF3D9A"></em>Zone en rupture</span>
      </div>
    </div>
    <div id="radar-bas">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <label class="cond" for="t" style="font-weight:800;font-size:19px;text-transform:uppercase">Rejouer les 48 dernières heures</label>
        <span id="quand" class="cond" style="font-weight:700;font-size:17px">Maintenant</span>
      </div>
      <div class="curseur">
        <button id="play" aria-label="Lire les 48 dernières heures">
          <svg id="icoPlay" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
          <svg id="icoPause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>
        </button>
        <input id="t" type="range" min="0" max="1000" step="1" value="1000">
      </div>
      <div class="compteurs">
        <div><strong id="nok" style="color:var(--j)">–</strong><small>stations approvisionnées</small></div>
        <div><strong id="nko" style="color:#FF6FB5">–</strong><small>stations en rupture</small></div>
      </div>
      <div id="rinfo" aria-live="polite"></div>
    </div>
  </section>

  <!-- ===== MON VÉHICULE ===== -->
  <section class="ecran" id="ecran-vehicule" aria-label="Mon véhicule"></section>

  <nav id="onglets" aria-label="Navigation principale">
    <button data-ecran="verdict"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Verdict</button>
    <button data-ecran="radar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12 18 6"/></svg>Radar</button>
    <button data-ecran="vehicule"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14M6 17l1.5-6h9L18 17M7.5 11 9 7h6l1.5 4"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/></svg>Mon véhicule</button>
  </nav>

  <!-- ===== ACCUEIL (premier lancement) ===== -->
  <div id="accueil" role="dialog" aria-modal="true" aria-label="Bienvenue">
    <div class="page" id="acc-page"></div>
    <div class="pied">
      <div class="points" id="acc-points"><i></i><i></i><i></i><i></i><i></i></div>
      <button class="btn-noir" id="acc-suivant">Suivant</button>
    </div>
  </div>

  <!-- ===== FEUILLE (contenu rempli par l'app) ===== -->
  <div id="voile"></div>
  <div class="feuille" id="feuille" role="dialog" aria-modal="true" aria-labelledby="feuille-titre">
    <div class="poignee"></div>
    <div class="feuille-tete"><h2 id="feuille-titre"></h2><button class="fermer" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button></div>
    <div id="feuille-corps" style="display:flex;flex-direction:column;gap:14px"></div>
  </div>

  <div id="conduite" role="dialog" aria-modal="true" aria-labelledby="conduite-t">
    <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#FFCC00" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="align-self:center"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="2.5"/><path d="M3 11.5c3-1 6-1.5 9-1.5s6 .5 9 1.5M12 14.5v7"/></svg>
    <h2 id="conduite-t">Vous roulez</h2>
    <p>Pour votre sécurité, laissez le passager utiliser l'app.</p>
    <button class="btn-noir" id="c-passager" style="background:var(--j);color:var(--n);border-color:var(--j)">Je suis passager</button>
  </div>
  <div id="toast" role="status"></div>
</div>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js" defer></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
